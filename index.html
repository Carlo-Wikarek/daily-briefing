<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:,">
    <title>DailyBriefing</title>
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #1d1d1f;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px 30px;
            border-bottom: 1px solid #e0e0e0;
            margin-bottom: 30px;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1d1d1f;
        }

        header .subtitle {
            color: #86868b;
            font-size: 0.9rem;
            margin-top: 8px;
        }

        .category {
            margin-bottom: 40px;
        }

        .category-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #1d1d1f;
            padding-bottom: 10px;
            border-bottom: 2px solid #1d1d1f;
            margin-bottom: 16px;
        }

        .articles {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .article-card {
            display: block;
            background: #ffffff;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            padding: 16px 20px;
            text-decoration: none;
            color: inherit;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .article-card:hover {
            border-color: #0071e3;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .article-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .article-source {
            font-size: 0.75rem;
            font-weight: 600;
            color: #0071e3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .article-date {
            font-size: 0.75rem;
            color: #86868b;
        }

        .article-title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.4;
            color: #1d1d1f;
        }

        .article-summary {
            font-size: 0.85rem;
            color: #86868b;
            margin-top: 6px;
            line-height: 1.4;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 16px;
        }

        .empty-state h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #86868b;
            font-size: 0.95rem;
        }

        footer {
            text-align: center;
            padding: 30px 20px;
            border-top: 1px solid #e0e0e0;
            margin-top: 40px;
            color: #86868b;
            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            .container {
                padding: 12px;
            }
            header h1 {
                font-size: 1.6rem;
            }
            .article-card {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>DailyBriefing</h1>
            <p class="subtitle">Deine taegliche Nachrichtenuebersicht &mdash; zuletzt aktualisiert am 28.04.2026 um 19:16 Uhr</p>
        </header>

        <main>
            
            <div class="empty-state">
                <div class="empty-icon">&#128240;</div>
                <h2>Keine neuen Artikel</h2>
                <p>Es wurden heute keine neuen Artikel gefunden. Schau morgen wieder vorbei!</p>
            </div>
        </main>

        <footer>
            <p>DailyBriefing &mdash; Automatisch generiert mit GitHub Actions</p>
        </footer>
    </div>
</body>
</html>
